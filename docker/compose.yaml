name: openirl

services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.1
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8890:8890/udp"
    expose:
      - "9997"
      - "9998"
    volumes:
      - ../integrations/mediamtx/mediamtx.yml:/mediamtx.yml:ro

  srtla-receiver:
    profiles: ["srtla"]
    build:
      context: ../integrations/srtla
    restart: unless-stopped
    init: true
    command:
      - --srtla_port
      - "5000"
      - --srt_hostname
      - mediamtx
      - --srt_port
      - "8890"
      - --log_level
      - info
    depends_on:
      - mediamtx
    ports:
      - "5000:5000/udp"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

  stats-bridge:
    build:
      context: ../services/stats-bridge
    restart: unless-stopped
    environment:
      MEDIAMTX_METRICS_URL: http://mediamtx:9998/metrics
      FEED_ID: feed-1
      MEDIA_PATH: live/feed-1
      PORT: 9090
    depends_on:
      - mediamtx
    ports:
      - "127.0.0.1:9090:9090"

# OBS and NOALBS run outside this development stack. See docs/phase-1.md.
