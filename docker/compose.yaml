name: openirl

services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.1
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: ${FEED_1_PASSWORD_HASH:?Set FEED_1_PASSWORD_HASH to the existing sha256 hash in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:1935:1935"
      - "127.0.0.1:8890:8890/udp"
      # HLS playback is private to the host and proxied narrowly by dashboard.
      - "127.0.0.1:8888:8888"
    expose:
      - "9997"
      - "9998"
    volumes:
      - ../integrations/mediamtx/mediamtx.yml:/mediamtx.yml:ro

  srtla-receiver:
    profiles: ["srtla"]
    build:
      context: ../integrations/srtla
    restart: unless-stopped
    init: true
    command:
      - --srtla_port
      - "5000"
      - --srt_hostname
      - mediamtx
      - --srt_port
      - "8890"
      - --log_level
      - info
    depends_on:
      - mediamtx
    ports:
      - "5000:5000/udp"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

  stats-bridge:
    build:
      context: ../services/stats-bridge
    restart: unless-stopped
    environment:
      MEDIAMTX_METRICS_URL: http://mediamtx:9998/metrics
      FEED_ID: feed-1
      MEDIA_PATH: live/feed-1
      PORT: 9090
    depends_on:
      - mediamtx
    ports:
      - "127.0.0.1:9090:9090"

  dashboard:
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      BIND_HOST: 127.0.0.1
      STATS_BRIDGE_URL: http://127.0.0.1:9090
      FEED_ID: feed-1
      OBS_WEBSOCKET_URL: ws://127.0.0.1:4455
      OBS_INGEST_SOURCE: ${OBS_INGEST_SOURCE:-}
      OBS_INGEST_AUDIO_SOURCE: ${OBS_INGEST_AUDIO_SOURCE:-}
      OBS_WEBSOCKET_PASSWORD: ${OBS_WEBSOCKET_PASSWORD:-}
      OPENIRL_CONTROL_TOKEN: ${OPENIRL_CONTROL_TOKEN:-}
      PREVIEW_UPSTREAM_URL: ${PREVIEW_UPSTREAM_URL:-http://127.0.0.1:8888}
    depends_on:
      - stats-bridge
    # Linux host networking lets the backend reach loopback-only OBS. The
    # dashboard itself also binds only to 127.0.0.1 inside this namespace.
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# OBS and NOALBS run outside this development stack. See docs/phase-1.md.
