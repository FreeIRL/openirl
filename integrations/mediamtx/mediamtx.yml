# Feed 1 publishing is credentialed. Compose supplies the existing SHA256 hash.
# The non-digest fallback can never match a SHA256 password (44 base64 chars).
logLevel: info

authMethod: internal
authInternalUsers:
  - user: openirl-feed-1
    pass: "sha256:UNCONFIGURED"
    ips: []
    permissions:
      - action: publish
        path: live/feed-1
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
      - action: playback
  - user: any
    pass:
    ips: ["127.0.0.1", "::1", "172.16.0.0/12"]
    permissions:
      - action: api
      - action: metrics

api: yes
apiAddress: :9997
metrics: yes
metricsAddress: :9998

rtmp: yes
rtmpAddress: :1935

srt: yes
srtAddress: :8890

# Low-latency HLS remuxes the source without transcoding. Compose publishes this
# listener on host loopback only; the dashboard proxies only live/feed-1.
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

paths:
  live/feed-1:
  live/feed-2:
  live/feed-3:
